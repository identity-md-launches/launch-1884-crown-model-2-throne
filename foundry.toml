[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "ipfs"
cbor_metadata = true
build_info = true
extra_output = ["metadata"]
ffi = false
fs_permissions = []
remappings = ["v4-core/=lib/v4-core/", "forge-std/=lib/forge-std/src/", "solmate/=lib/solmate/"]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 110
ignore = ["lib/**"]
